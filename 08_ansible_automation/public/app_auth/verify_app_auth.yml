---
- name: Verify Flask Application Login, Session, CSRF, and Origin TLS
  hosts: public_servers
  become: true
  gather_facts: false

  vars_files:
    - ../vars/public.yml
    - ../origin_tls/vars/origin_tls.yml
    - vars/app_auth.yml

  vars:
    app_auth_playbook_dir: "{{ playbook_dir }}"
    verification_report_path: "{{ app_auth_verification_report }}"
    verification_report_title: Application Authentication Verification
    verification_scope: >-
      Canonical Flask Application Login verification through ArvanCloud and
      direct Origin HTTPS
    verification_success_message: >-
      Overall application authentication verification: PASSED

  tasks:
    - name: Run canonical Application Login verification tasks
      ansible.builtin.import_tasks: >-
        {{ playbook_dir }}/tasks/verify_application_login.yml
