---
# Public origin server
origin_ip: 185.192.114.171
deployment_user: rahmati
deployment_group: rahmati

# ArvanCloud-facing domain
application_domain: nhref.ir
application_aliases: []

# This package assumes:
# User HTTPS -> ArvanCloud Edge -> HTTP port 80 on the origin.
arvan_origin_protocol: http
origin_http_port: 80

# Deployment
deployment_dir: /opt/seo-auditor
source_dir: "{{ playbook_dir }}/../../04_docker"
compose_project_name: seo-auditor-public

# Images and application
backend_image_name: seo-auditor-backend
backend_image_tag: "1.1"
mariadb_image: mariadb:10.11.18-jammy
mariadb_database: example
nginx_image: nginx:1.30.4-alpine

# Fixed UID/GID used by the non-root backend image
backend_uid: 10001
backend_gid: 10001
secret_group: appcontainer

# SEO crawler limits
seo_max_pages: 25
seo_request_timeout_seconds: 5
seo_max_response_bytes: 2000000
seo_max_redirects: 5
seo_crawl_delay_seconds: 0.15
seo_user_agent: "Nhref-SEO-Auditor/1.1 (+https://nhref.ir/)"

# ArvanCloud real-client-IP configuration
arvan_ip_list_url: https://www.arvancloud.ir/en/ips.txt
arvan_cdn_cidrs_fallback:
  - 185.143.232.0/22
  - 188.229.116.16/30
  - 94.101.182.0/27
  - 2.144.3.128/28
  - 37.32.16.0/27
  - 37.32.17.0/27
  - 37.32.18.0/27
  - 37.32.19.0/27
  - 185.215.232.0/22
  - 178.131.120.48/28
  - 94.101.183.0/28
  - 78.157.36.112/28
  - 95.38.61.80/28

# Origin security
enable_basic_auth: true
basic_auth_username: seo-admin
basic_auth_local_dir: "{{ playbook_dir }}/.secrets"
basic_auth_password_file: "{{ basic_auth_local_dir }}/basic_auth_password"
basic_auth_credentials_file: "{{ playbook_dir }}/generated_basic_auth_credentials.txt"

# Nginx protection
nginx_audit_rate: 5r/m
nginx_audit_burst: 2
nginx_max_connections_per_ip: 10
nginx_proxy_read_timeout: 240s
nginx_client_max_body_size: 32k

# Optional provider-firewall hardening is intentionally not automated here.
# First verify the application through ArvanCloud, then restrict origin port 80
# to the current ArvanCloud IP ranges in the provider firewall.
