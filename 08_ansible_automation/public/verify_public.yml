---
- name: Verify public deployment with Flask Application Login
  hosts: public_servers
  become: true
  gather_facts: false

  vars_files:
    - vars/public.yml
    - origin_tls/vars/origin_tls.yml
    - app_auth/vars/app_auth.yml

  vars:
    app_auth_playbook_dir: "{{ playbook_dir }}/app_auth"
    verification_report_path: "{{ playbook_dir }}/verification_public.txt"
    verification_report_title: ArvanCloud Public Deployment Verification
    verification_scope: >-
      Public infrastructure, end-to-end TLS, and Flask Application Login
    verification_success_message: >-
      Overall public deployment verification: PASSED

  tasks:
    - name: Run canonical Application Login verification tasks
      ansible.builtin.import_tasks: >-
        {{ playbook_dir }}/app_auth/tasks/verify_application_login.yml
