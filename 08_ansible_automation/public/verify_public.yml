---
- name: Verify the ArvanCloud public deployment
  hosts: public_servers
  become: true
  gather_facts: false

  vars_files:
    - vars/public.yml

  tasks:
    - name: Retrieve the existing Basic Auth password
      ansible.builtin.set_fact:
        basic_auth_password: >-
          {{
            lookup(
              'ansible.builtin.password',
              basic_auth_password_file
            )
          }}
      no_log: true
      when: enable_basic_auth | bool

    - name: Validate the active Compose configuration
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - .env
          - -f
          - docker-compose.yml
          - config
          - --quiet
        chdir: "{{ deployment_dir }}"
      changed_when: false

    - name: Read the Compose service status
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - .env
          - -f
          - docker-compose.yml
          - ps
          - --all
        chdir: "{{ deployment_dir }}"
      register: compose_status
      changed_when: false

    - name: Test the active Nginx configuration
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - .env
          - -f
          - docker-compose.yml
          - exec
          - -T
          - proxy
          - nginx
          - -t
        chdir: "{{ deployment_dir }}"
      register: nginx_config_test
      changed_when: false

    - name: Test the origin Nginx health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/nginx-health
        method: GET
        headers:
          Host: "{{ application_domain }}"
        status_code: 200
        return_content: true
      register: origin_nginx_health

    - name: Test the origin backend health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        method: GET
        headers:
          Host: "{{ application_domain }}"
        status_code: 200
        return_content: true
      register: origin_backend_health

    - name: Test the protected SEO interface on the origin
      ansible.builtin.uri:
        url: http://127.0.0.1/
        method: GET
        headers:
          Host: "{{ application_domain }}"
        url_username: "{{ basic_auth_username }}"
        url_password: "{{ basic_auth_password }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
      register: origin_application_auth_test
      no_log: true
      when: enable_basic_auth | bool

    - name: Test the SEO interface on the origin without authentication
      ansible.builtin.uri:
        url: http://127.0.0.1/
        method: GET
        headers:
          Host: "{{ application_domain }}"
        status_code: 200
        return_content: true
      register: origin_application_noauth_test
      when: not enable_basic_auth | bool

    - name: Select the origin application verification content
      ansible.builtin.set_fact:
        origin_application_content: >-
          {{
            (origin_application_auth_test.content | default(''))
            if (enable_basic_auth | bool)
            else (origin_application_noauth_test.content | default(''))
          }}
      no_log: true

    - name: Test the origin directly from the Controller
      ansible.builtin.uri:
        url: "http://{{ origin_ip }}/"
        method: GET
        headers:
          Host: "{{ application_domain }}"
        url_username: "{{ basic_auth_username if enable_basic_auth else omit }}"
        url_password: "{{ basic_auth_password if enable_basic_auth else omit }}"
        force_basic_auth: "{{ enable_basic_auth | bool }}"
        status_code: 200
        return_content: true
        timeout: 30
      register: controller_origin_test
      no_log: true
      delegate_to: localhost
      become: false

    - name: Wait for the ArvanCloud HTTPS port
      ansible.builtin.wait_for:
        host: "{{ application_domain }}"
        port: 443
        state: started
        connect_timeout: 5
        timeout: 30
      delegate_to: localhost
      become: false

    - name: Probe the public TLS endpoint without credentials
      ansible.builtin.uri:
        url: "https://{{ application_domain }}/"
        method: GET
        validate_certs: true
        use_proxy: false
        follow_redirects: safe
        status_code:
          - 200
          - 401
          - 403
        return_content: false
        timeout: 30
      register: public_tls_probe
      delegate_to: localhost
      become: false
    - name: Test the public site through ArvanCloud
      ansible.builtin.uri:
        url: >-
          https://{{ application_domain }}/?deployment_check={{
            lookup('ansible.builtin.pipe', 'date +%s')
          }}
        method: GET
        headers:
          Cache-Control: no-cache
          Pragma: no-cache
        url_username: "{{ basic_auth_username if enable_basic_auth else omit }}"
        url_password: "{{ basic_auth_password if enable_basic_auth else omit }}"
        force_basic_auth: "{{ enable_basic_auth | bool }}"
        validate_certs: true
        use_proxy: false
        follow_redirects: safe
        status_code: 200
        return_content: true
        timeout: 45
      register: public_application_test
      no_log: true
      delegate_to: localhost
      become: false

    - name: Resolve the public domain from the Controller
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "{{ application_domain }}"
      register: public_domain_resolution
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Read the TLS certificate served by the ArvanCloud edge
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          printf '' |
          openssl s_client \
            -connect {{ application_domain }}:443 \
            -servername {{ application_domain }} \
            2>/dev/null |
          openssl x509 \
            -noout \
            -subject \
            -issuer \
            -dates \
            -fingerprint \
            -sha256
      register: edge_certificate
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Confirm the SEO UI is returned on every path
      ansible.builtin.assert:
        that:
          - "'SEO Auditor' in origin_application_content"
          - "'SEO Auditor' in controller_origin_test.content"
          - "'SEO Auditor' in public_application_test.content"
        fail_msg: >-
          The SEO Auditor UI was not returned by the origin or the ArvanCloud
          public endpoint. Purge the ArvanCloud cache and verify origin settings.
        success_msg: "Origin and ArvanCloud public responses contain the SEO Auditor UI."

    - name: Collect recent Compose logs
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - .env
          - -f
          - docker-compose.yml
          - logs
          - --no-color
          - --timestamps
          - --tail
          - "80"
        chdir: "{{ deployment_dir }}"
      register: compose_logs
      changed_when: false

    - name: Write the public verification report on the Controller
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/verification_public.txt"
        mode: "0644"
        content: |
          ========================================
          ArvanCloud Public Deployment Verification
          ========================================

          Generated at:
          {{ lookup('ansible.builtin.pipe', 'date --iso-8601=seconds') }}

          Domain:
          {{ application_domain }}

          Origin:
          {{ origin_ip }}:{{ origin_http_port }}

          ArvanCloud origin protocol expected by this package:
          {{ arvan_origin_protocol }}

          ----------------------------------------
          Public DNS
          ----------------------------------------

          {{ public_domain_resolution.stdout }}

          ----------------------------------------
          Docker Compose Status
          ----------------------------------------

          {{ compose_status.stdout }}

          ----------------------------------------
          Nginx Configuration Test
          ----------------------------------------

          {{ nginx_config_test.stdout | default('') }}
          {{ nginx_config_test.stderr | default('') }}

          ----------------------------------------
          Origin Health Tests
          ----------------------------------------

          Nginx health status: {{ origin_nginx_health.status }}
          Nginx response: {{ origin_nginx_health.content | trim }}

          Backend health status: {{ origin_backend_health.status }}
          Backend response: {{ origin_backend_health.content | trim }}

          ----------------------------------------
          Application Tests
          ----------------------------------------

          Origin local test: PASSED
          Direct origin test from Controller: PASSED
          Public ArvanCloud test: PASSED
          SEO Auditor UI detected: PASSED

          ----------------------------------------
          ArvanCloud Edge Certificate
          ----------------------------------------

          {{ edge_certificate.stdout }}

          ----------------------------------------
          Recent Compose Logs
          ----------------------------------------

          {{ compose_logs.stdout }}

          ----------------------------------------
          Final Result
          ----------------------------------------

          Overall public deployment verification: PASSED
      delegate_to: localhost
      become: false

    - name: Display the verification output paths
      ansible.builtin.debug:
        msg:
          - "Verification: {{ playbook_dir }}/verification_public.txt"
          - >-
            Credentials:
            {{ basic_auth_credentials_file
               if enable_basic_auth
               else 'Basic Auth is disabled' }}
