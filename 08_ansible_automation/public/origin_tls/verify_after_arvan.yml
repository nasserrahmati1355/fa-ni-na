---
- name: Verify ArvanCloud-to-Origin TLS with Flask Application Login
  hosts: public_servers
  become: true
  gather_facts: false

  vars_files:
    - ../vars/public.yml
    - vars/origin_tls.yml
    - ../app_auth/vars/app_auth.yml

  vars:
    app_auth_playbook_dir: "{{ playbook_dir }}/../app_auth"
    verification_report_path: "{{ origin_tls_verification_file }}"
    verification_report_title: ArvanCloud End-to-End TLS Verification
    verification_scope: >-
      ArvanCloud Edge TLS, direct Origin TLS, and Flask Application Login
    verification_success_message: >-
      Overall end-to-end TLS and application-login verification: PASSED

  tasks:
    - name: Run canonical Application Login verification tasks
      ansible.builtin.import_tasks: >-
        {{ playbook_dir }}/../app_auth/tasks/verify_application_login.yml
